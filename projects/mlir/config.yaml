project_name: "mlir"

execution:
  # The driver handles the binary path dynamically, but this acts as a fallback/template
  command: "/workspace/install/bin/mlir-opt {seed_path}"
  timeout: 10
  concurrency: 16
  # Worker model: fusion is pure Python and, with 16+ worker threads,
  # serialises on the GIL (clang: 78-92 tests/s at any thread count with
  # the box 15-18% busy). Forked worker processes measured 2.95x on an
  # idle host and 3.1x (30.1 -> 94.4 tests/s) in the three-project rotation, at
  # ~3.6 GB of extra memory. 2026-09-15.
  worker_model: processes

analysis:
  # 58% of the injected (LLM-translated) MLIR bug corpus and 11% of the
  # mlir/test seeds do not parse/verify on their own; such a seed yields
  # children rejected at the same line. Dropped after --pre-analysis
  # records rc.
  drop_seeds_failing_alone: true
  crash_patterns:
    - "AddressSanitizer"
    - "UndefinedBehaviorSanitizer"
    - "Segmentation fault"
    - "LLVM ERROR"
    - "Assertion failed"
    - ": Assertion `"
    - "UNREACHABLE executed"
    - "report_fatal_error"
    - "Aborted"
    - "internal compiler error"
    - "core dumped"
  syntax_patterns:
    - "error: unexpected error"
    - "error: expected"
    - "error: custom op"
    - "error: invalid"
    - "error: unrecognized"
    - "error: "

paths:
  # Standard location of MLIR tests in the monorepo
  seed_source: "projects/mlir/llvm-project/mlir/test"
  seed_corpus: "projects/mlir/corpus.db"

llm:
  provider: "openai" # Options: gemini, openai, vllm, ollama
  model: "gpt-4o-mini"
  # api_key: "" # Defaults to LLM_API_KEY env var
  # api_base: "" # Optional, for vllm/ollama
  timeout: 30
  # rate: 0.05 # Probability to use LLM generation in fuzz loop
