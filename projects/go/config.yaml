project_name: "go"

execution:
  # projects/go/driver.py builds the real command (module context, target,
  # gcflags) per seed; this is only BaseDriver's fallback.
  command: "go build {seed_path}"
  timeout: 30          # cross-compiling for a cold target builds its stdlib
  concurrency: 24
  # Address-space cap per compilation, enforced with `ulimit -v`. A fused
  # program can send the type checker into unbounded instantiation; without
  # this the host OOM killer fires and can take the orchestrator with it.
  mem_limit_mb: 4096
  # Ceiling on the shared build cache at .fused/go-cache. cmd/go trims its
  # own cache at most once a day and only drops entries unused for five days
  # (trimInterval / trimLimit in src/cmd/go/internal/cache/cache.go), so on a
  # continuous run it reclaims nothing for the first five days while every
  # distinct fused program keeps adding entries. projects/go/driver.py
  # enforces this cap instead, evicting oldest-used-first the way cmd/go
  # does. Set to 0 to disable. The floor is roughly 400 MB: the thirteen
  # target standard libraries are ~30 MB each and are worth keeping resident.
  cache_limit_mb: 3072
  # Executions between cache size checks. Each check walks the cache's 256
  # shard directories, so it should be rare relative to execution but
  # frequent relative to how fast the cache grows by its headroom.
  cache_check_every: 500

analysis:
  # `go build` exits 1 for every rejected program, and its diagnostics
  # ("undefined: x", "cannot use ... as int value") carry no "error:"
  # token for the generic validity check to key on — only "syntax
  # error:" does. Without this, a child with three type errors was
  # booked as *valid*: measured on the test corpus, state fusion showed
  # 96.7% valid while 35% of its parents fail to compile on their own.
  # Exit code 1 is the compiler's own verdict, so it is the metric's.
  error_return_codes: [1]
  # A seed the toolchain rejects on its own (an API removed since the
  # test was written — `os.EOF` — or a directive the build refuses)
  # produces children rejected at the same line. Drop those after
  # --pre-analysis, *except* `// errorcheck` files, which are ill-formed
  # by design and kept for the error-recovery paths (see the note under
  # seed_exclude_patterns).
  drop_seeds_failing_alone: true
  drop_seeds_failing_alone_except: '(?m)^//\s*errorcheck'
  # These are the coarse net; projects/go/analyzer.py makes the actual
  # decision and *subtracts* the resource-exhaustion shapes that match
  # here but say nothing about Go (out of memory, signal: killed).
  #
  # Note "internal compiler error" alone is not enough: base.FatalfAt only
  # prints it when no ordinary errors were reported first, so on fused
  # input an ICE frequently arrives as a bare panic + stack instead. The
  # panic/goroutine patterns are what catch those.
  crash_patterns:
    - "internal compiler error"
    - "panic: "
    - "fatal error: "
    - "WARNING: DATA RACE"
    - "runtime error:"
    - "signal SIGSEGV"
    - "unexpected fault address"
    - "goroutine stack exceeds"
    - "checkptr:"
  # A fused Go program is usually ill-formed; an ordinary diagnostic is the
  # expected outcome, not a finding. Go's are bare "file:line:col: msg", so
  # these match the recurring compiler messages rather than a prefix.
  syntax_patterns:
    - "syntax error"
    - "undefined:"
    - "declared and not used"
    - "imported and not used"
    - "cannot use"
    - "too many errors"

paths:
  seed_source: "projects/go/seeds"
  seed_corpus: "projects/go/corpus.db"

  seed_exclude_patterns:
    # cgo seeds need a C toolchain for the target and cannot cross-compile;
    # they also cannot be fused with a non-cgo seed into one file, because
    # the `import "C"` preamble is position-sensitive.
    - pattern: '(?m)^\s*import\s+"C"|^\s*//\s*#include'
      reason: "uses cgo (import \"C\"), which cannot cross-compile or be fused"
    # Files whose build constraints exclude every target this driver uses.
    # They compile to an empty package, so every execution on them is spent
    # learning nothing.
    - pattern: '(?m)^//go:build\s+(?:ignore|never)\b'
      reason: "//go:build ignore — never part of a build"
    # Tests that only mean something as a whole directory: the companion
    # files are not in the corpus, so these can never resolve.
    - pattern: '(?m)^//\s*(?:rundir|compiledir|errorcheckdir|runindir)\b'
      reason: "directory-based test; its companion files are not in the corpus"
    # Relative and non-standard-library imports. `import "./a"` is how
    # Go's directory-based tests reach a sibling file; in module mode it
    # is rejected before the compiler runs ("relative import paths are
    # not supported in module mode"). A path whose first element has a
    # dot (`github.com/...`, `issue46653.dir/...`) is never the standard
    # library, and GOPROXY=off means it can never be fetched. Together
    # these were 15% (dataflow) to 30% (state) of the invalid children,
    # and none of them ever reached the compiler proper.
    - pattern: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"\.\.?/'
      reason: "relative import; rejected in module mode before compiling"
    - pattern: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"[^"/]*\.[^"/]*/'
      reason: "imports a non-stdlib module; GOPROXY=off can never resolve it"
    # Only the standard library can use this directive; the seed fails
    # identically on every run.
    - pattern: '(?m)^//go:uintptrkeepalive\b'
      reason: "//go:uintptrkeepalive is only allowed in the standard library"
    # An import whose first path element is not a standard-library
    # package (`test/x`, `issue1234/a`): never resolvable with GOPROXY=off.
    - pattern: '(?m)^\s*(?:import\s+)?(?:[\w.]+\s+)?"(?!(?:archive|bufio|builtin|bytes|cmp|compress|container|context|crypto|database|debug|embed|encoding|errors|expvar|flag|fmt|go|hash|html|image|index|io|iter|log|maps|math|mime|net|os|path|plugin|reflect|regexp|runtime|slices|sort|strconv|strings|structs|sync|syscall|testing|text|time|unicode|unique|unsafe|weak|vendor|internal)(?:/|"))[^"./][^"]*"'
      reason: "imports a package outside the standard library; unresolvable with GOPROXY=off"
    # NOTE: `// errorcheck` files are deliberately NOT excluded. They are
    # ill-formed on purpose, the way clang's -verify tests are, and the
    # clang adapter does exclude those — but Go's compiler swallows an ICE
    # whenever ordinary errors came first, so error-recovery paths are
    # exactly where an under-tested crash can hide. driver.py passes
    # -d=panic precisely to make those visible.

llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  api_key: ""
  timeout: 30
