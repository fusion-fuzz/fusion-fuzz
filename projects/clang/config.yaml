project_name: "clang"

execution:
  # The driver picks the binary (clang/clang++) and flags dynamically per
  # seed; this template is only used as a BaseDriver fallback.
  command: "clang -fsyntax-only {seed_path}"
  timeout: 10
  concurrency: 16
  # Worker model: fusion is pure Python and, with 16+ worker threads,
  # serialises on the GIL (clang: 78-92 tests/s at any thread count with
  # the box 15-18% busy). Forked worker processes measured 2.95x on an
  # idle host and 3.3x (clang) and +23% (gcc) in the three-project rotation, at
  # ~3.6 GB of extra memory. 2026-09-15.
  worker_model: processes

analysis:
  # Seeds clang rejects on their own (pre-analysis) are dropped, except
  # `-verify` tests: their expected-error/warning lines mean the rejection
  # is the test, and Sema's error-recovery paths are worth fuzzing.
  drop_seeds_failing_alone: true
  drop_seeds_failing_alone_except: 'expected-(?:error|warning)'
  crash_patterns:
    - "SUMMARY: AddressSanitizer"
    - "SUMMARY: UndefinedBehaviorSanitizer"
    - "LLVM ERROR"
    - "Assertion `"
    - "Stack dump:"
    - "Segmentation fault"
    - "Aborted"
    - "core dumped"
    - "PLEASE submit a bug report"
  syntax_patterns:
    - "error: "
    - "fatal error: "

paths:
  seed_exclude_patterns:
    # `#include "x.inc"` / split-file tests: the sibling file is not in the
    # corpus, so every child is "fatal error: file not found" (11-19% of
    # all invalid children before this).
    - pattern: '(?m)^\s*#\s*include\s+"'
      reason: "includes a sibling file that is not in the corpus"
    - pattern: '(?m)^//\s*RUN:.*split-file'
      reason: "multi-file split-file test"
    # `%S` is the test's source directory: `-I %S/Inputs`, `-isystem %S`
    # mean the seed includes headers that live next to it, not here.
    - pattern: '(?m)^//\s*RUN:.*(?:-I|-isystem|-include|-imacros)\s*%S\b'
      reason: "includes headers from the test's own directory"
    # Target-specific intrinsic headers and RUN lines that pair a non-x86
    # triple with -target-feature: the types they use do not exist for the
    # host target this driver compiles for.
    - pattern: '#\s*include\s+<(?:arm_[a-z0-9_]+|riscv_[a-z0-9_]+|lasxintrin|lsxintrin|larchintrin|altivec|s390intrin|vecintrin|msa|htmintrin|htmxlintrin|__clang_hip[a-z_]*|__clang_cuda[a-z_]*|hlsl[a-z_/]*)\.h>'
      reason: "target-specific intrinsic header; host target has no such types"
    - pattern: '(?m)^//\s*RUN:(?=.*-triple\s+(?!x86_64|i[3-6]86|%))(?=.*-target-feature)'
      reason: "needs a non-host target with target features"
  seed_source: "projects/clang/llvm-project/clang/test"
  seed_corpus: "projects/clang/corpus.db"

llm:
  provider: "deepseek"  # Options: gemini, openai, vllm, ollama
  model: "deepseek-v4-flash"
  api_key: ""
  timeout: 30
