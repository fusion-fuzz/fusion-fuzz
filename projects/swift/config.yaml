project_name: "swift"

execution:
  # This is informational for the driver, SwiftDriver handles the actual docker exec
  command: "docker exec ffl-swift swift {seed_path}"
  timeout: 10
  concurrency: 64

analysis:
  crash_patterns:
    - "Please submit a bug report"
    - "Assertion failed:"
  # 57% of the harvested swift-test seeds do not type-check on their own:
  # `-verify` tests written around expected-error comments, imports of
  # test-only modules (StdlibUnittest, OSLog), RUN-line-dependent files.
  # Measured with the seed's own `-typecheck` run (--pre-analysis records
  # rc); such a seed yields children rejected at the same line, so drop
  # it for the run. Baseline before this: dataflow 8.7%, state 14.0%.
  drop_seeds_failing_alone: true

paths:
  # Update this if you have a local seed directory
  seed_source: "projects/swift/seeds"

llm:
  provider: "openai" # Options: gemini, openai, vllm, ollama
  model: "gpt-4o-mini"
  api_key: ""
  # api_key: "" # Defaults to LLM_API_KEY env var
  # api_base: "" # Optional, for vllm/ollama
  timeout: 30
  # rate: 0.05 # Probability to use LLM generation in fuzz loop
