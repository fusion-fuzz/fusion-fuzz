project_name: "lfortran"

execution:
  # The driver picks flags dynamically per seed; this template is only
  # used as a BaseDriver fallback.
  command: "lfortran --show-asr {seed_path}"
  timeout: 10
  concurrency: 16

analysis:
  # The seeds are flang's test suite, and LFortran rejects 55% of them on
  # its own (features it does not implement yet, plus flang's negative
  # tests) — 38% of the injected Fortran bug corpus likewise. Such a
  # seed yields children rejected at the same line; dropped after
  # --pre-analysis records rc.
  drop_seeds_failing_alone: true
  crash_patterns:
    - "SUMMARY: AddressSanitizer"
    - "SUMMARY: UndefinedBehaviorSanitizer"
    - "Segfault: Signal SIGSEGV"
    - "Abort: Signal SIGABRT"
    - "Internal Compiler Error"
    - "AssertFailed"
    - "LCOMPILERS_ASSERT failed"
    - "runtime_error:"
    # UBSan's report line (the build is sanitized). "parser.yy: runtime
    # error: member access within null pointer" was 24-28% of every
    # strategy's children on the flang-test corpus and matched nothing
    # here — an LFortran bug reached on a quarter of all executions and
    # never filed. One signature, deduplicated once.
    - "runtime error:"
    - "std::exception:"
    - "Unknown Exception"
    - "terminate called after throwing"
    - "Segmentation fault"
    - "Aborted"
    - "core dumped"
  syntax_patterns:
    - "syntax error"
    - "semantic error"
    - "tokenizer error"
    - "prescanner error"

paths:
  # Shared with projects/flang: both are Fortran frontends, so they fuzz
  # off the exact same seed corpus (llvm-project's flang/test) instead of
  # each maintaining a separate clone. See projects/lfortran/setup.py.
  seed_source: "projects/flang/llvm-project/flang/test"
  seed_corpus: "projects/lfortran/corpus.db"

llm:
  provider: "openai"  # Options: gemini, openai, vllm, ollama
  model: "gpt-5.4-mini"
  api_key: "" # Defaults to LLM_API_KEY env var
  timeout: 30
