project_name: "flang"

execution:
  # The driver picks flags dynamically per seed; this template is only
  # used as a BaseDriver fallback.
  command: "flang -fsyntax-only {seed_path}"
  # Sized for the sanitizer-instrumented compiler projects/flang/setup.py
  # builds: ASan+UBSan makes flang several times slower, and at 10s roughly
  # one execution in seven was timing out at -O3 — each one booked as a
  # syntax error, since a timeout is indistinguishable from a rejected
  # program to the analyzer.
  timeout: 40
  concurrency: 16

analysis:
  crash_patterns:
    # Both the SUMMARY and the ERROR line: a sanitizer report normally ends
    # with SUMMARY, but ASan's allocator hard-errors (an absurd allocation
    # size, which in a compiler means a size was computed wrong) print only
    # the ERROR line. setup.py builds flang with ASan+UBSan by default, so
    # these are live oracles, not dead patterns.
    - "SUMMARY: AddressSanitizer"
    - "ERROR: AddressSanitizer"
    - "SUMMARY: UndefinedBehaviorSanitizer"
    - "runtime error: "
    - "LLVM ERROR"
    - "Assertion `"
    - "Stack dump:"
    - "Segmentation fault"
    - "Aborted"
    - "core dumped"
    - "PLEASE submit a bug report"
    - "internal compiler error"
  syntax_patterns:
    - "error: "
    - "fatal error: "

paths:
  seed_source: "projects/flang/llvm-project/flang/test"
  seed_corpus: "projects/flang/corpus.db"
  # flang/test also carries .fir/.mlir dumps and other non-source
  # artifacts under the same tree; the parser only picks up Fortran
  # source extensions, so no blacklist is needed here.

llm:
  provider: "openai"  # Options: gemini, openai, vllm, ollama
  model: "gpt-5.4-mini"
  api_key: "" # Defaults to LLM_API_KEY env var
  timeout: 30
